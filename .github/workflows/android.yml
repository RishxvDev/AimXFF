name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Locate project
        id: proj
        run: |
          if [ -z "$(find . -name settings.gradle.kts | head -1)" ]; then
            z=$(ls ./*.zip 2>/dev/null | head -1)
            if [ -n "$z" ]; then echo "Unzipping $z"; unzip -q -o "$z"; fi
          fi
          f=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$f" ]; then echo "settings.gradle.kts not found. Files in repo:"; find . -maxdepth 3 -not -path './.git/*'; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project folder: $(dirname "$f")"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimX-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
